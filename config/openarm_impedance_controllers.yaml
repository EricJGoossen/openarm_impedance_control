controller_manager:
  ros__parameters:
    update_rate: 400

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    left_controller:
      type: openarm_impedance_controller/OpenArmImpedanceController

    right_controller:
      type: openarm_impedance_controller/OpenArmImpedanceController

    left_gripper_controller:
      type: position_controllers/GripperActionController

    right_gripper_controller:
      type: position_controllers/GripperActionController

    # hardware_components_initial_state:
    #   inactive:
    #     - "openarm_left_hardware_interface"
    #     - "openarm_right_hardware_interface"

left_controller:
  ros__parameters:
    joints:
      - openarm_left_joint1
      - openarm_left_joint2
      - openarm_left_joint3
      - openarm_left_joint4
      - openarm_left_joint5
      - openarm_left_joint6
      - openarm_left_joint7
    ee_frame_name: openarm_left_hand_tcp

    do_gravity_compensation: true

    # Fallback only -- normally overridden by the motor_gains_file launch
    # argument in openarm_impedance_control.launch.py.
    motor_gains_file: "../openarm_description/assets/robot/openarm_v1.0/config/arm/control_gains.yaml"

    # TCP workspace box (m, base frame). A goal is rejected whole if any
    # waypoint's TCP falls outside. Set both to [] to disable the check.
    cartesian_position_min: [-0.8, -0.8, 0.0]
    cartesian_position_max: [ 0.8,  0.8, 1.2]

    # Joint position limits are read from the URDF -- there is no override
    # here. checkPoint() computes lo=q_lower_+margin, hi=q_upper_-margin,
    # so a NEGATIVE margin widens the admissible window outward past the
    # declared URDF limits (positive would narrow it inward, as it did
    # before this was set to 0.0). Physically nudging joint4 off its
    # boundary didn't hold -- it settles back to a steady-state ~-0.0002
    # rad past its own 0.0 lower limit (gravity-comp isn't perfectly
    # exact / minor mechanical sag). -0.005 rad gives ~25x that observed
    # deviation as headroom, capped well inside GoalLimits's
    # kMinJointPositionMargin=-0.05 floor (goal_limits.cpp) so this stays
    # a tiny tolerance, not a real relaxation of the safety limit.
    # NOTE: GoalLimits::reportViolations() (the periodic "outside its URDF
    # limit" warning) compares against the raw, un-margined URDF bounds by
    # design -- it will likely keep printing even after this fix. That's
    # expected/informational; what matters is whether goals keep getting
    # rejected. Fixed at configure time -- requires relaunching this
    # controller to take effect (see
    # OpenArmImpedanceController::onParameterChange).
    joint_position_margin: -0.015

    # Runtime safety trip on TCP speed (m/s). 0 disables it.
    cartesian_velocity_limit: 0.0

    # Per-joint torque clamp (Nm) -- rated torques by motor:
    #   joints 1-2: DM-J8009P (~45 Nm rated)
    #   joint  3:   DM-J4340P (~25 Nm rated)
    #   joint  4:   DM-J4340  (~20 Nm rated)
    #   joints 5-7: DM-J4310  (~10 Nm rated)
    # Used both as the goal-validation limit and the runtime effort backstop.
    # HALVE THESE for first bring-up of this control scheme.
    joint_torque_limits: [45.0, 45.0, 25.0, 20.0, 15.0, 15.0, 15.0]

    # Estimated Cartesian wrench trip [fx fy fz mx my mz] (N, N*m)
    # TODO(review): raised from [50,50,50,15,15,15] -- concurrent bimanual
    # motion (both arms independently commanded at once) rocks the shared
    # base enough that q_ref-q tracking error spikes transiently on both
    # arms in sync (confirmed via bringup_logs/stage6_bimanual_independent/
    # .../20260907_144159_concurrent_independent_1: real measured joint
    # effort stayed <8 Nm throughout, well under joint_torque_limits, while
    # this estimate -- built from tracking error, not a real F/T sensor --
    # tripped on both arms at the same instant). The Jacobian pseudo-inverse
    # in checkCartesianWrenchTrip can amplify a modest per-joint tracking
    # error into a large apparent Cartesian wrench, especially away from
    # well-conditioned configurations. Picked a moderate increase rather
    # than a large one since this is still first bring-up; re-tighten if
    # real telemetry ever shows genuine large effort alongside a trip.
    cartesian_wrench_limits: [90.0, 90.0, 90.0, 25.0, 25.0, 25.0]


right_controller:
  ros__parameters:
    joints:
      - openarm_right_joint1
      - openarm_right_joint2
      - openarm_right_joint3
      - openarm_right_joint4
      - openarm_right_joint5
      - openarm_right_joint6
      - openarm_right_joint7
    ee_frame_name: openarm_right_hand_tcp

    do_gravity_compensation: true

    motor_gains_file: "../openarm_description/assets/robot/openarm_v1.0/config/arm/control_gains.yaml"

    cartesian_position_min: [-0.8, -0.8, 0.0]
    cartesian_position_max: [ 0.8,  0.8, 1.2]
    joint_position_margin: -0.005

    cartesian_velocity_limit: 0.0

    joint_torque_limits: [45.0, 45.0, 25.0, 20.0, 15.0, 15.0, 15.0]

    # TODO(review): see matching note under left_controller above -- raised
    # from [50,50,50,15,15,15] for the same concurrent-bimanual coupling
    # transient, confirmed on this arm's telemetry in the same trial.
    cartesian_wrench_limits: [90.0, 90.0, 90.0, 25.0, 25.0, 25.0]


left_gripper_controller:
  ros__parameters:
    joint: openarm_left_finger_joint1
    action_monitor_rate: 20.0
    goal_tolerance: 0.01
    max_effort: 5.0
    allow_stalling: false
    stall_velocity_threshold: 0.001
    stall_timeout: 1.0


right_gripper_controller:
  ros__parameters:
    joint: openarm_right_finger_joint1
    action_monitor_rate: 20.0
    goal_tolerance: 0.01
    max_effort: 5.0
    allow_stalling: false
    stall_velocity_threshold: 0.001
    stall_timeout: 1.0